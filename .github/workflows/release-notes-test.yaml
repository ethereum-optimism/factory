name: release notes tests

on:
  pull_request:
    paths:
      - actions/release-notes/**
      - .github/workflows/release-notes-test.yaml
  push:
    branches: [main]
    paths:
      - actions/release-notes/**
      - .github/workflows/release-notes-test.yaml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@71cf2267d89c5cb81562390fa70a37fa40b1305e # v6
        with:
          persist-credentials: false
      - uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6 # v1
        with:
          version: 1.3.4
      - name: Verify release notes round trip and validation
        run: python3 -m unittest discover -s actions/release-notes -p 'test_*.py' -v
