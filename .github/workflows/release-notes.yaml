name: Publish image release notes (Reusable)

on:
  workflow_call:
    inputs:
      image:
        description: Artifact Registry image path without a tag or digest.
        required: true
        type: string
      release_tag:
        description: GitHub Release tag. Defaults to the caller's release event; set for manual backfills.
        type: string
        default: ''
      image_tag:
        description: Override the image tag. By default, use the release tag with the image-name/ prefix removed.
        type: string
        default: ''
      gcp_project_id:
        description: Google Cloud project for authentication.
        type: string
        default: oplabs-tools-artifacts
      workload_identity_provider:
        description: Workload identity provider trusted by the calling repository.
        type: string
        default: projects/441280564867/locations/global/workloadIdentityPools/github/providers/github-oidc
      service_account:
        description: Optional service account to impersonate; empty uses direct workload identity federation.
        type: string
        default: ''
      wait_seconds:
        description: Maximum wait for the image tag to exist (0 to 1800 seconds).
        type: number
        default: 900
    outputs:
      image:
        description: Immutable image reference to which the notes were attached.
        value: ${{ jobs.publish.outputs.image }}
      reference:
        description: Release-notes attachment reference, suitable for oras pull.
        value: ${{ jobs.publish.outputs.reference }}

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.resolve.outputs.image }}
      reference: ${{ steps.notes.outputs.reference }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout calling repository
        uses: actions/checkout@71cf2267d89c5cb81562390fa70a37fa40b1305e
        with:
          persist-credentials: false

      # Keep preparation inline: a reusable workflow's checkout and github
      # context belong to its caller, not this Factory checkout.
      - name: Read GitHub Release notes
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
          IMAGE: ${{ inputs.image }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          WAIT_SECONDS: ${{ inputs.wait_seconds }}
        run: |
          python3 <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import tempfile

          image = os.environ["IMAGE"]
          tag = os.environ["RELEASE_TAG"]
          image_tag = os.environ["IMAGE_TAG"]
          wait = float(os.environ["WAIT_SECONDS"])
          if not 0 <= wait <= 1800:
              raise SystemExit("wait_seconds must be between 0 and 1800")
          if not re.fullmatch(r"[a-z0-9-]+-docker\.pkg\.dev/[a-z0-9-]+/[a-z0-9._-]+/(?:[a-z0-9._-]+/)*[a-z0-9._-]+", image):
              raise SystemExit("image must be an Artifact Registry image path without a tag or digest")
          if not tag or tag.startswith("-") or any(c.isspace() for c in tag):
              raise SystemExit("A GitHub Release tag is required; use a release event or release_tag")
          if not image_tag:
              prefix, _, image_tag = tag.rpartition("/")
              if prefix and prefix != image.rsplit("/", 1)[-1]:
                  raise SystemExit("Release tag prefix does not match the image name; set image_tag explicitly")
          if not re.fullmatch(r"[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}", image_tag):
              raise SystemExit("Release tag cannot be mapped to a Docker tag; set image_tag explicitly")
          result = subprocess.run([
              "gh", "release", "view", tag, "--repo", os.environ["RELEASE_REPOSITORY"],
              "--json", "tagName,isDraft,body",
          ], check=True, capture_output=True, text=True)
          release = json.loads(result.stdout)
          if release["tagName"] != tag or release["isDraft"]:
              raise SystemExit("Release must be published and match the requested tag")
          body = release.get("body")
          if not isinstance(body, str) or not body.strip():
              raise SystemExit("GitHub Release has no release notes")
          notes = Path(tempfile.mkdtemp(prefix="release-notes-", dir=os.environ["RUNNER_TEMP"])) / "RELEASE_NOTES.md"
          notes.write_bytes(body.encode("utf-8"))
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"tagged_image={image}:{image_tag}", file=output)
              print(f"file={notes}", file=output)
              print(f"registry={image.split('/')[0]}", file=output)
          PY

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ inputs.gcp_project_id }}
          workload_identity_provider: ${{ inputs.workload_identity_provider }}
          service_account: ${{ inputs.service_account }}
          create_credentials_file: true

      - name: Configure Artifact Registry credentials
        env:
          REGISTRY: ${{ steps.release.outputs.registry }}
        run: gcloud auth configure-docker "$REGISTRY" --quiet

      - name: Set up mise
        uses: jdx/mise-action@c1ecc8f748cd28cdeabf76dab3cccde4ce692fe4
        with:
          install: false
          cache: false

      - name: Wait for the published image and resolve its digest
        id: resolve
        env:
          TAGGED_IMAGE: ${{ steps.release.outputs.tagged_image }}
          IMAGE: ${{ inputs.image }}
          WAIT_SECONDS: ${{ inputs.wait_seconds }}
        run: |
          mise exec aqua:oras-project/oras@1.3.4 -- python3 <<'PY'
          import os
          import re
          import subprocess
          import time
          from urllib.parse import quote

          deadline = time.monotonic() + float(os.environ["WAIT_SECONDS"])
          while True:
              result = subprocess.run(
                  ["oras", "resolve", os.environ["TAGGED_IMAGE"]],
                  capture_output=True, text=True,
                  timeout=60,
              )
              if result.returncode == 0:
                  digest = result.stdout.strip()
                  if not re.fullmatch(r"sha256:[a-f0-9]{64}", digest):
                      raise SystemExit("Registry returned an invalid image digest")
                  break
              error = result.stderr.lower()
              if any(word in error for word in ("unauthorized", "forbidden", "denied", "401", "403")):
                  raise SystemExit(result.stderr)
              if not any(word in error for word in ("not found", "manifest_unknown", "name_unknown", "404")):
                  raise SystemExit(result.stderr)
              remaining = deadline - time.monotonic()
              if remaining <= 0:
                  raise SystemExit("Timed out waiting for the release image: " + result.stderr)
              print("Release image is not published yet; retrying...", flush=True)
              time.sleep(min(15, remaining))
          image = os.environ["IMAGE"] + "@" + digest
          host, project, repository, package = os.environ["IMAGE"].split("/", 3)
          location = host.removesuffix("-docker.pkg.dev")
          console_url = f"https://console.cloud.google.com/artifacts/docker/{project}/{location}/{repository}/{quote(package, safe='')}/{digest}?project={project}"
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"image={image}", file=output)
              print(f"console_url={console_url}", file=output)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              print(f"Release image: `{os.environ['TAGGED_IMAGE']}`\n\nDigest: `{image}`\n", file=summary)
          PY

      - name: Attach release notes to the published digest
        id: notes
        # Pin the publisher independently; no checkout of mutable Factory code.
        uses: ethereum-optimism/factory/actions/release-notes@cf21a2a5dd19b9e8548292d10c975bf9c8f14c1c
        with:
          image: ${{ steps.resolve.outputs.image }}
          file: ${{ steps.release.outputs.file }}

      - name: Verify the attachment and link to Artifact Registry
        env:
          IMAGE: ${{ steps.resolve.outputs.image }}
          NOTES_FILE: ${{ steps.release.outputs.file }}
          NOTES_REFERENCE: ${{ steps.notes.outputs.reference }}
          CONSOLE_URL: ${{ steps.resolve.outputs.console_url }}
        run: |
          set -euo pipefail
          verification_dir="$(mktemp -d "$RUNNER_TEMP/release-notes-verify.XXXXXX")"
          mise exec aqua:oras-project/oras@1.3.4 -- \
            oras discover --distribution-spec v1.1-referrers-api \
              --artifact-type application/vnd.oplabs.release-notes.v1 \
              --format json "$IMAGE" > "$verification_dir/referrers.json"
          jq -e --arg digest "${NOTES_REFERENCE##*@}" \
            '.referrers | any(.digest == $digest)' "$verification_dir/referrers.json"
          mise exec aqua:oras-project/oras@1.3.4 -- \
            oras pull -o "$verification_dir/downloaded" "$NOTES_REFERENCE"
          cmp "$NOTES_FILE" "$verification_dir/downloaded/RELEASE_NOTES.md"
          {
            echo
            echo 'Release notes verified: discovery, download, and byte comparison passed.'
            echo
            echo "[Open the image in Artifact Registry]($CONSOLE_URL), then select Attachments."
          } >> "$GITHUB_STEP_SUMMARY"
