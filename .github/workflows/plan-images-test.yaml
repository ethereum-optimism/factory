name: plan-images tests

on:
  pull_request:
    paths:
      - actions/build-packages/**
      - actions/fetch-apks/**
      - actions/plan-images/**
      - actions/fork-context/**
      - actions/publish-image/**
      - actions/promote-image/**
      - actions/smoke-test/**
      - scripts/lint-untrusted-permissions*
      - test/fixtures/**
      - .github/workflows/build-images*.yaml
      - .github/workflows/plan-images-test.yaml
  push:
    branches:
      - main
    paths:
      - actions/build-packages/**
      - actions/fetch-apks/**
      - actions/plan-images/**
      - actions/fork-context/**
      - actions/publish-image/**
      - actions/promote-image/**
      - actions/smoke-test/**
      - scripts/lint-untrusted-permissions*
      - test/fixtures/**
      - .github/workflows/build-images*.yaml
      - .github/workflows/plan-images-test.yaml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@71cf2267d89c5cb81562390fa70a37fa40b1305e # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Test plan-images
        run: actions/plan-images/plan-images.test.sh

      - name: Test build-packages build directory resolution
        run: actions/build-packages/resolve-build-root.test.sh

      - name: Test build-packages free disk script
        run: actions/build-packages/free-disk.test.sh

      - name: Test publish-image bake overrides
        run: actions/publish-image/publish-image.test.sh

      - name: Test fetch-apks
        run: python3 -m unittest discover -s actions/fetch-apks -p 'test_*.py' -v

      - name: Test smoke-test assertions
        run: actions/smoke-test/smoke-test.test.sh

      - name: Test promote-image digest checks
        run: actions/promote-image/promote.test.sh

      - name: Lint self-tests
        run: scripts/lint-untrusted-permissions.test.sh
