name: Renovate (Reusable)

# Self-hosted Renovate engine, run inside our own GitHub Actions.
# Execution + credentials stay in our infra (no third-party write access).
# CVE-only policy lives in each repo's renovate.json, which extends
# github>ethereum-optimism/factory:renovate-config.
#
# Callers pass NOVE_RENOVATE_URL and grant id-token: write.

on:
  workflow_call:
    inputs:
      logLevel:
        description: "Renovate log level (debug|info|warn)."
        type: string
        default: "info"
      dryRun:
        description: "Dry run (no PRs)."
        type: boolean
        default: false
      runner:
        description: "GitHub Actions runner label."
        type: string
        default: "ubuntu-latest"
    secrets:
      NOVE_RENOVATE_URL:
        required: true
        description: "Base URL of the token exchange service."

permissions:
  contents: read

jobs:
  renovate:
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Mint Renovate token
        id: sts
        env:
          NOVE_RENOVATE_URL: ${{ secrets.NOVE_RENOVATE_URL }}
        run: |
          set -euo pipefail
          oidc="$(curl --fail --silent --show-error --retry 3 -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=nove-renovate" | jq -r .value)"
          echo "::add-mask::$oidc"
          token="$(curl --fail --silent --show-error --retry 3 -H "Authorization: Bearer $oidc" "${NOVE_RENOVATE_URL}/sts/exchange?scope=${GITHUB_REPOSITORY}&identity=renovate" | jq -r .token)"
          test -n "$token" && test "$token" != null
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Renovate
        uses: renovatebot/github-action@3064367f740a1a91cca218698a63902689cce200 # v46.1.20
        with:
          token: ${{ steps.sts.outputs.token }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: "required"
          LOG_LEVEL: ${{ inputs.logLevel }}
          RENOVATE_DRY_RUN: ${{ inputs.dryRun && 'full' || null }}
