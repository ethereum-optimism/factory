name: Actions Lock (Reusable)
# Verifies that every action referenced by the calling repository's workflows
# matches the commit SHAs recorded in .github/workflows/actions.lock.

on:
  workflow_call:

permissions: {}

jobs:
  verify:
    permissions:
      contents: read
    runs-on: ubuntu-latest

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@71cf2267d89c5cb81562390fa70a37fa40b1305e # v6
        with:
          persist-credentials: false

      - name: Install gh-actions-lock
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh extension install github/gh-actions-lock --pin v0.2.0

      - name: Verify actions lockfile
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh actions-lock --verify
