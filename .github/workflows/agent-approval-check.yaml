name: agent-approval-check

on:
  workflow_call:

jobs:
  check:
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    steps:
      - uses: ethereum-optimism/factory/actions/agent-approval-check@13d0dd19a0d2a9422fdc22f20aa0908fff793510
        with:
          required_approvals: 2
          agent_logins: claude[bot],claude-code[bot],Copilot,copilot-swe-agent[bot],centaur-bot,OptimismBot,opgitgovernance
          excluded_approvers: OptimismBot,opgitgovernance
