name: agent-approval-check

on:
  workflow_call:

jobs:
  check:
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    steps:
      - uses: ethereum-optimism/factory/actions/agent-approval-check@7517da65f053390e649dbcae280ba327f9ee9372
        with:
          required_approvals: 2
          agent_emails: noreply@anthropic.com,209825114+claude[bot]@users.noreply.github.com,198982749+Copilot@users.noreply.github.com,centaur@oplabs.co,ai@centaur.local,agent@centaur.dev,centaur-bot@users.noreply.github.com,56264719+centaur-bot@users.noreply.github.com,112345690+OptimismBot@users.noreply.github.com,OptimismBot@users.noreply.github.com,optibot@oplabs.co,188376469+opgitgovernance@users.noreply.github.com,opgitgovernance@users.noreply.github.com,githubgovernance@oplabs.co
          agent_logins: claude[bot],claude-code[bot],Copilot,copilot-swe-agent[bot],centaur-bot,OptimismBot,opgitgovernance
          excluded_approvers: OptimismBot,opgitgovernance
          agent_branch_prefixes: centaur/,claude/,copilot/
