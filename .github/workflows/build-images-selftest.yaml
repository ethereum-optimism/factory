name: build-images self-test

on:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: lint and lint self-tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@71cf2267d89c5cb81562390fa70a37fa40b1305e # v6
        with:
          persist-credentials: false

      - name: Lint build-images and its actions
        run: scripts/lint-untrusted-permissions.sh

      - name: Lint self-tests
        run: scripts/lint-untrusted-permissions.test.sh

  build-images:
    name: build-images (untrusted path)
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/build-images.yaml
    with:
      config: test/fixtures/images.json
