name: build-images self-test

on:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: lint and lint self-tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@71cf2267d89c5cb81562390fa70a37fa40b1305e # v6
        with:
          persist-credentials: false

      - name: Lint build-images and its actions
        run: scripts/lint-untrusted-permissions.sh

      - name: Lint self-tests
        run: scripts/lint-untrusted-permissions.test.sh

  build-images:
    name: build-images (untrusted path)
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/build-images.yaml
    with:
      config: test/fixtures/images.json

  apko-revision:
    name: apko index carries the built commit as revision
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@71cf2267d89c5cb81562390fa70a37fa40b1305e # v6
        with:
          persist-credentials: false

      - name: Install op-apko
        id: apko_bin
        uses: ./actions/install-op-apko

      - name: Build the apko fixture with the publish mounts
        env:
          APKO_BIN: ${{ steps.apko_bin.outputs.path }}
        run: |
          set -euo pipefail
          source actions/publish-image/apko-mounts.sh
          sandbox="$(tr -d '[:space:]' < actions/apko-sdk/image)"
          config_dir="$(cd test/fixtures/apko && pwd)"
          out_dir="$(mktemp -d "$RUNNER_TEMP/apko-revision.XXXXXX")"
          mkdir "$out_dir/layout"
          apko_container_layout "$config_dir" "$out_dir"
          docker run --rm --network host --entrypoint /usr/bin/apko \
            --workdir "$apko_workdir" \
            -v "${APKO_BIN}:/usr/bin/apko:ro" \
            "${apko_mounts[@]}" \
            "$sandbox" \
            build --ignore-signatures --arch amd64 \
            "${config_dir}/tiny.yaml" "example.invalid/apko-revision-check:selftest" "$out_dir/layout"

          revision="$(jq -r '.annotations["org.opencontainers.image.revision"] // empty' "$out_dir/layout/index.json")"
          expected="$(git rev-parse HEAD)"
          if [ "$revision" != "$expected" ]; then
            echo "::error::index revision is '${revision}', expected ${expected}" >&2
            exit 1
          fi
          echo "index revision: $revision"

  apko-sandbox-version:
    name: apko in the sandbox is the pinned op-apko
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@71cf2267d89c5cb81562390fa70a37fa40b1305e # v6
        with:
          persist-credentials: false

      - name: Install op-apko
        id: apko_bin
        uses: ./actions/install-op-apko

      - name: Check apko version inside the sandbox
        env:
          APKO_BIN: ${{ steps.apko_bin.outputs.path }}
        run: |
          set -euo pipefail
          expected="$(yq '.runs.steps[0].env.VERSION' actions/install-op-apko/action.yml)"
          sandbox="$(tr -d '[:space:]' < actions/apko-sdk/image)"
          output="$(docker run --rm --network none --entrypoint /usr/bin/apko \
            -v "${APKO_BIN}:/usr/bin/apko:ro" \
            "$sandbox" version)"
          printf '%s\n' "$output"
          actual="$(printf '%s\n' "$output" | awk '$1 == "GitVersion:" { print $2 }')"
          if [ "$actual" != "$expected" ]; then
            echo "::error::apko in the sandbox reports '${actual}', expected '${expected}'" >&2
            exit 1
          fi
          echo "apko in the sandbox: $actual"
