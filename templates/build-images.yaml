# Caller for ethereum-optimism/factory build-images.yaml.
# Copy to .github/workflows/build-images.yaml in the repository that owns the images.
# Keep .github/images.json in that repository describing the images.
name: Build images

on:
  push:
    branches:
      - main
      - develop
    tags:
      - '*/v*'
      - 'v*'
  pull_request:
  merge_group:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-images:
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ethereum-optimism/factory/.github/workflows/build-images.yaml@<FULL_SHA>
