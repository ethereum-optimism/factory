name: Agent Approval Check
description: Require distinct write-capable human approvals for pull requests opened by agent accounts

inputs:
  github_token:
    description: Token with pull-requests:write and statuses:write permissions
    default: ${{ github.token }}
  required_approvals:
    description: Number of distinct human approvals required
    default: "2"
  agent_logins:
    description: Comma-separated GitHub logins of agent accounts. Pull requests authored by these logins are gated, and their approvals never count
    default: claude[bot],claude-code[bot]
  excluded_approvers:
    description: Comma-separated machine-user logins that never count as humans
    default: ""
  protected_bases:
    description: Comma-separated protected base branches; empty means the default branch. Pull requests stacked onto these bases are also gated
    default: ""

runs:
  using: composite
  steps:
    - name: Evaluate agent approvals
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        REQUIRED_APPROVALS: ${{ inputs.required_approvals }}
        AGENT_LOGINS: ${{ inputs.agent_logins }}
        EXCLUDED_APPROVERS: ${{ inputs.excluded_approvers }}
        PROTECTED_BASES: ${{ inputs.protected_bases }}
      run: python3 "${{ github.action_path }}/agent_approval_check.py"
