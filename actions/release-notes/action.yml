name: Publish image release notes
description: Attach a Markdown release-notes file to an image digest using OCI 1.1 referrers. Requires existing registry authentication.

inputs:
  image:
    description: Fully qualified image reference with the final manifest digest (registry/name@sha256:...).
    required: true
  file:
    description: Path to the customer-facing Markdown release notes.
    required: true

outputs:
  reference:
    description: Fully qualified attachment reference, suitable for oras pull.
    value: ${{ steps.publish.outputs.reference }}

runs:
  using: composite
  steps:
    - name: Set up mise
      uses: jdx/mise-action@c1ecc8f748cd28cdeabf76dab3cccde4ce692fe4
      with:
        install: false
        cache: false
    - name: Publish release notes
      id: publish
      shell: bash
      env:
        RELEASE_NOTES_IMAGE: ${{ inputs.image }}
        RELEASE_NOTES_FILE: ${{ inputs.file }}
      run: mise exec aqua:oras-project/oras@1.3.4 -- bash "$GITHUB_ACTION_PATH/publish.sh"
