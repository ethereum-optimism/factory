name: 'Publish image'
description: >
  Build one image and print its digest. Four kinds: apko publishes a
  multi-architecture image with apko publish inside the pinned Wolfi SDK image;
  ko publishes a multi-architecture image with ko build for every architecture
  in one invocation; docker-arch builds one architecture natively and pushes it
  by digest. These three push to the local staging registry in stage_registry,
  for actions/smoke-test and actions/promote-image to test and copy the exact
  digest. docker-manifest merges the per-architecture digests already in the
  registry into the tagged manifest list. The action configures the gcloud
  Docker credential helper for the registry. The calling job must authenticate
  to Google Cloud with google-github-actions/auth first.

inputs:
  kind:
    description: 'apko, ko, docker-arch, or docker-manifest.'
    required: true
  registry:
    description: 'Registry prefix without trailing slash, for example us-docker.pkg.dev/project/repo.'
    required: true
  image:
    description: 'Catalog image name. Names the build cache scope, and the registry path when repository is empty.'
    required: true
  repository:
    description: 'Registry path under registry, for example group/name. Empty uses image.'
    required: false
    default: ''
  sha_tag:
    description: 'Tag for the commit SHA, including any builder prefix and variant suffix. apko and ko kinds push it to the staging registry; docker-manifest publishes it.'
    required: true
  ref_tag:
    description: 'Tag for the sanitized ref or release version, including any builder prefix and variant suffix. Published by the docker-manifest kind; actions/promote-image publishes it for the other kinds.'
    required: true
  stage_registry:
    description: 'apko, ko, and docker-arch kinds: local staging registry address, for example localhost:5000. Required for those kinds.'
    required: false
    default: ''
  alias_tags:
    description: 'docker-manifest kind only: extra tag names, comma-separated, without registry, each including any builder prefix and variant suffix. Published on the same image as sha_tag and ref_tag. Empty publishes none.'
    required: false
    default: ''
  id:
    description: 'Leg identifier. The digest is written to RUNNER_TEMP/<id>.txt.'
    required: true
  archs:
    description: 'apko kind only: comma-separated architectures, for example amd64,arm64.'
    required: false
    default: 'amd64,arm64'
  config:
    description: 'apko kind only: apko configuration path, relative to the repository root.'
    required: false
    default: ''
  repositories:
    description: 'apko kind only: comma-separated APK repository directories from stage-packages.'
    required: false
    default: ''
  lockfile:
    description: 'apko kind only: apko lock file, relative to the repository root. When set, apko publishes offline from cache_dir with --lockfile and --require-strong-checksums.'
    required: false
    default: ''
  cache_dir:
    description: 'apko kind only, with lockfile: apko cache directory from the apk-cache artifact.'
    required: false
    default: ''
  package_digests_dir:
    description: 'apko kind only, with lockfile and repositories: directory of apk-digests files from the package legs. Each package the lock marks local is accepted only with one of these digests.'
    required: false
    default: ''
  arch:
    description: 'docker-arch kind only: architecture to build and push, amd64 or arm64.'
    required: false
    default: ''
  mode:
    description: 'docker-arch kind only: build (Dockerfile) or bake (bake file).'
    required: false
    default: 'build'
  context:
    description: 'docker-arch kind only: build context.'
    required: false
    default: '.'
  dockerfile:
    description: 'docker-arch kind only: Dockerfile path relative to the context.'
    required: false
    default: 'Dockerfile'
  target:
    description: 'docker-arch kind only: build stage or bake target.'
    required: false
    default: ''
  build_args:
    description: 'docker-arch kind only: build arguments, KEY=VALUE per line.'
    required: false
    default: ''
  bake_file:
    description: 'docker-arch kind only, bake mode: bake file path.'
    required: false
    default: 'docker-bake.hcl'
  set:
    description: 'docker-arch kind only, bake mode: bake variables, KEY=VALUE per line.'
    required: false
    default: ''
  digests_dir:
    description: 'docker-manifest kind only: directory holding the per-architecture digest files.'
    required: false
    default: ''
  importpath:
    description: 'ko kind only: Go package to build, relative to the context.'
    required: false
    default: ''
  ko_config:
    description: 'ko kind only: ko configuration file, relative to the repository root. Empty uses ko defaults.'
    required: false
    default: ''
  ldflags:
    description: 'ko kind only: one go build ldflags value per line.'
    required: false
    default: ''
  env:
    description: 'ko kind only: environment for the ko build, KEY=VALUE per line.'
    required: false
    default: ''

outputs:
  digest:
    description: 'Digest of the published image or manifest list, sha256:...'
    value: ${{ steps.digest.outputs.digest }}

runs:
  using: composite
  steps:
    - name: Require a staging registry
      if: inputs.kind != 'docker-manifest'
      shell: bash
      env:
        STAGE_REGISTRY: ${{ inputs.stage_registry }}
      run: |
        set -euo pipefail
        if [[ ! "$STAGE_REGISTRY" =~ ^localhost:[0-9]+$ ]]; then
          echo "::error::stage_registry must be localhost:<port>, got '$STAGE_REGISTRY'" >&2
          exit 1
        fi

    - name: Configure Artifact Registry credential helper
      shell: bash
      env:
        REGISTRY: ${{ inputs.registry }}
      run: |
        set -euo pipefail
        gcloud auth configure-docker "${REGISTRY%%/*}" --quiet

    - name: Resolve apko sandbox image
      id: sandbox
      if: inputs.kind == 'apko'
      shell: bash
      run: |
        set -euo pipefail
        echo "image=$(tr -d '[:space:]' < "${GITHUB_ACTION_PATH}/../apko-sdk/image")" >> "$GITHUB_OUTPUT"

    - name: Install op-apko
      id: apko_bin
      if: inputs.kind == 'apko'
      uses: ./.factory/actions/install-op-apko

    - name: Set up Docker Buildx
      if: inputs.kind != 'apko'
      uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4
      with:
        driver-opts: network=host

    - name: Publish with apko
      id: apko
      if: inputs.kind == 'apko'
      shell: bash
      env:
        APKO_SANDBOX: ${{ steps.sandbox.outputs.image }}
        APKO_BIN: ${{ steps.apko_bin.outputs.path }}
        APKO_CONFIG: ${{ inputs.config }}
        APKO_TAG: ${{ inputs.stage_registry }}/${{ inputs.repository || inputs.image }}:${{ inputs.sha_tag }}
        APKO_REPOSITORIES: ${{ inputs.repositories }}
        APKO_ARCHS: ${{ inputs.archs }}
        APKO_LOCKFILE: ${{ inputs.lockfile }}
        APKO_CACHE_DIR: ${{ inputs.cache_dir }}
        APKO_DIGESTS_DIR: ${{ inputs.package_digests_dir }}
        APKO_BUILD_ROOT: ${{ runner.temp }}
      run: |
        set -euo pipefail
        config_path="${GITHUB_WORKSPACE}/${APKO_CONFIG}"
        config_dir="$(cd "$(dirname "$config_path")" && pwd)"
        config_file="$(basename "$config_path")"
        out_dir="$(mktemp -d "${APKO_BUILD_ROOT}/apko-publish.XXXXXX")"

        source "${GITHUB_ACTION_PATH}/apko-mounts.sh"
        apko_container_layout "$config_dir" "$out_dir"
        mounts=(-v "${APKO_BIN}:/usr/bin/apko:ro" "${apko_mounts[@]}")
        if [ -n "$APKO_REPOSITORIES" ]; then
          IFS=',' read -ra repos <<< "$APKO_REPOSITORIES"
          for repo in "${repos[@]}"; do
            mounts+=(-v "${repo}:${repo}:ro")
          done
        fi
        lock_path=""
        cache_dir=""
        local_packages=""
        if [ -n "$APKO_LOCKFILE" ]; then
          if [ -z "$APKO_CACHE_DIR" ] || [ ! -d "$APKO_CACHE_DIR" ]; then
            echo "::error::lockfile $APKO_LOCKFILE needs the apk-cache artifact in cache_dir" >&2
            exit 1
          fi
          lock_path="$(cd "$(dirname "${GITHUB_WORKSPACE}/${APKO_LOCKFILE}")" && pwd)/$(basename "$APKO_LOCKFILE")"
          cache_dir="$(cd "$APKO_CACHE_DIR" && pwd)"
          mounts+=(-v "${lock_path}:${lock_path}:ro" -v "${cache_dir}:${cache_dir}")
          local_packages="$("${GITHUB_ACTION_PATH}/../build-image/local-packages.sh" "$lock_path" "$APKO_DIGESTS_DIR" "$APKO_ARCHS" | paste -sd, -)"
        fi

        read -r -d '' apko_script <<'APKO_EOF' || true
        set -euo pipefail
        export SOURCE_DATE_EPOCH=0
        repos=()
        [[ -n "$APKO_REPOSITORIES" ]] && repos=(-r "$APKO_REPOSITORIES")
        mode_args=(--ignore-signatures)
        if [[ -n "$APKO_LOCK_PATH" ]]; then
          mode_args=(--lockfile "$APKO_LOCK_PATH" --offline --cache-dir "$APKO_CACHE_PATH" --require-strong-checksums)
          if [[ -n "$APKO_LOCAL_PACKAGES" ]]; then
            IFS=',' read -ra accepted <<< "$APKO_LOCAL_PACKAGES"
            for entry in "${accepted[@]}"; do
              mode_args+=(--local-package "$entry")
            done
          fi
        fi
        /usr/bin/apko publish \
          "${mode_args[@]}" \
          --arch "$APKO_ARCHS" \
          "${repos[@]+"${repos[@]}"}" \
          "$APKO_CONFIG_PATH" "$APKO_TAG" | tee "$APKO_OUT_DIR/publish.digest"
        APKO_EOF

        docker run --rm --network host \
          --entrypoint /bin/bash \
          --workdir "$apko_workdir" \
          "${mounts[@]}" \
          -e APKO_TAG \
          -e APKO_REPOSITORIES \
          -e APKO_ARCHS \
          -e APKO_CONFIG_PATH="${config_dir}/${config_file}" \
          -e APKO_OUT_DIR="$out_dir" \
          -e APKO_LOCK_PATH="$lock_path" \
          -e APKO_CACHE_PATH="$cache_dir" \
          -e APKO_LOCAL_PACKAGES="$local_packages" \
          "$APKO_SANDBOX" -c "$apko_script"

        ref="$(tail -n 1 "${out_dir}/publish.digest")"
        echo "digest=${ref##*@}" >> "$GITHUB_OUTPUT"

    - name: Publish with ko
      id: ko
      if: inputs.kind == 'ko'
      shell: bash
      env:
        KO_CONTEXT: ${{ inputs.context }}
        KO_IMPORTPATH: ${{ inputs.importpath }}
        KO_CONFIG: ${{ inputs.ko_config }}
        KO_LDFLAGS: ${{ inputs.ldflags }}
        KO_ENV: ${{ inputs.env }}
        KO_ARCHS: ${{ inputs.archs }}
        KO_REPO: ${{ inputs.stage_registry }}/${{ inputs.repository || inputs.image }}
        KO_SHA_TAG: ${{ inputs.sha_tag }}
        KO_BUILD_ROOT: ${{ runner.temp }}
      run: |
        set -euo pipefail
        out_dir="$(mktemp -d "${KO_BUILD_ROOT}/ko-publish.XXXXXX")"

        platforms=""
        IFS=',' read -ra archs <<< "$KO_ARCHS"
        for arch in "${archs[@]}"; do
          arch="${arch// /}"
          platforms="${platforms}linux/${arch},"
        done
        platforms="${platforms%,}"

        ko_args=(build --bare --sbom=spdx --platform="$platforms" --tags="$KO_SHA_TAG")
        while IFS= read -r flag; do
          if [ -n "$flag" ]; then
            ko_args+=("--ldflags=${flag}")
          fi
        done <<< "$KO_LDFLAGS"

        if [ -n "$KO_CONFIG" ]; then
          export KO_CONFIG_PATH="${GITHUB_WORKSPACE}/${KO_CONFIG}"
        fi
        while IFS= read -r entry; do
          if [ -n "$entry" ]; then
            key="${entry%%=*}"
            export "${key}=${entry#*=}"
          fi
        done <<< "$KO_ENV"

        export KO_DOCKER_REPO="$KO_REPO"
        cd "${GITHUB_WORKSPACE}/${KO_CONTEXT}"
        ko "${ko_args[@]}" "$KO_IMPORTPATH" > "${out_dir}/publish.out"

        ref="$(tail -n 1 "${out_dir}/publish.out")"
        if [[ "$ref" != "${KO_REPO}@sha256:"* && "$ref" != "${KO_REPO}:${KO_SHA_TAG}@sha256:"* ]]; then
          echo "::error::ko did not print a published reference for ${KO_REPO}; got: '$ref'" >&2
          exit 1
        fi
        echo "digest=${ref##*@}" >> "$GITHUB_OUTPUT"

    - name: Push architecture with docker build
      id: build
      if: inputs.kind == 'docker-arch' && inputs.mode == 'build'
      uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7
      env:
        SOURCE_DATE_EPOCH: '0'
      with:
        context: "{{defaultContext}}:${{ inputs.context }}"
        file: ${{ inputs.dockerfile }}
        target: ${{ inputs.target }}
        platforms: linux/${{ inputs.arch }}
        build-args: ${{ inputs.build_args }}
        provenance: mode=max
        sbom: true
        push: true
        cache-from: type=gha,scope=${{ inputs.image }}-docker-${{ inputs.arch }}
        cache-to: type=gha,mode=max,scope=${{ inputs.image }}-docker-${{ inputs.arch }}
        outputs: type=image,push-by-digest=true,name-canonical=true,name=${{ inputs.stage_registry }}/${{ inputs.repository || inputs.image }},push=true,registry.insecure=true

    - name: Push architecture with docker bake
      id: bake
      if: inputs.kind == 'docker-arch' && inputs.mode == 'bake'
      uses: docker/bake-action@a66e1c87e2eca0503c343edf1d208c716d54b8a8 # v7
      env:
        SOURCE_DATE_EPOCH: '0'
      with:
        source: .
        targets: ${{ inputs.target }}
        files: ${{ inputs.bake_file }}
        push: true
        set: |
          *.platform=linux/${{ inputs.arch }}
          *.tags=
          *.attest=type=provenance,mode=max
          *.attest=type=sbom
          *.cache-from=type=gha,scope=${{ inputs.image }}-docker-${{ inputs.arch }}
          *.cache-to=type=gha,mode=max,scope=${{ inputs.image }}-docker-${{ inputs.arch }}
          *.output=type=image,push-by-digest=true,name-canonical=true,name=${{ inputs.stage_registry }}/${{ inputs.repository || inputs.image }},push=true,registry.insecure=true
          ${{ inputs.set }}

    - name: Merge digests into manifest list
      id: merge
      if: inputs.kind == 'docker-manifest'
      shell: bash
      env:
        REGISTRY: ${{ inputs.registry }}
        IMAGE: ${{ inputs.image }}
        REPOSITORY: ${{ inputs.repository || inputs.image }}
        SHA_TAG: ${{ inputs.sha_tag }}
        REF_TAG: ${{ inputs.ref_tag }}
        ALIAS_TAGS: ${{ inputs.alias_tags }}
        DIGESTS_DIR: ${{ inputs.digests_dir }}
      run: |
        set -euo pipefail
        name="${REGISTRY}/${REPOSITORY}"
        refs=()
        for digest_file in "$DIGESTS_DIR"/*.txt; do
          [ -f "$digest_file" ] || continue
          refs+=("${name}@$(tr -d '[:space:]' < "$digest_file")")
        done
        if [ "${#refs[@]}" -eq 0 ]; then
          echo "::error::no digest files in $DIGESTS_DIR" >&2
          exit 1
        fi
        tag_args=(-t "${name}:${SHA_TAG}" -t "${name}:${REF_TAG}")
        if [ -n "$ALIAS_TAGS" ]; then
          IFS=',' read -ra alias_tags <<< "$ALIAS_TAGS"
          for alias_tag in "${alias_tags[@]}"; do
            tag_args+=(-t "${name}:${alias_tag}")
          done
        fi
        for attempt in 1 2 3; do
          if timeout 180 docker buildx imagetools create \
            "${tag_args[@]}" \
            "${refs[@]}"; then
            break
          fi
          if [[ "$attempt" -eq 3 ]]; then
            echo "::error::imagetools create failed after ${attempt} attempts" >&2
            exit 1
          fi
          echo "::warning::imagetools create attempt ${attempt} failed, retrying in 30s"
          sleep 30
        done
        inspect_output=$(docker buildx imagetools inspect "${name}:${SHA_TAG}")
        manifest_digest=$(echo "$inspect_output" | grep 'Digest:' | head -1 | awk '{print $2}')
        platforms=$(echo "$inspect_output" | grep -E 'Platform:' | awk '{print $2}' | tr '\n' ' ')
        echo "digest=${manifest_digest}" >> "$GITHUB_OUTPUT"
        {
          echo "## Multi-arch manifest: ${IMAGE}"
          echo ""
          echo "| | |"
          echo "|---|---|"
          echo "| **Image** | \`${name}\` |"
          echo "| **Digest** | \`${manifest_digest}\` |"
          echo "| **Platforms** | ${platforms} |"
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Refresh registry auth for attestation push
      if: inputs.kind == 'docker-manifest'
      shell: bash
      env:
        REGISTRY: ${{ inputs.registry }}
      run: bash "${GITHUB_ACTION_PATH}/refresh-attest-auth.sh"

    - name: Resolve digest
      id: digest
      shell: bash
      env:
        KIND: ${{ inputs.kind }}
        APKO_DIGEST: ${{ steps.apko.outputs.digest }}
        KO_DIGEST: ${{ steps.ko.outputs.digest }}
        BUILD_DIGEST: ${{ steps.build.outputs.digest }}
        BAKE_METADATA: ${{ steps.bake.outputs.metadata }}
        BAKE_TARGET: ${{ inputs.target }}
        MERGE_DIGEST: ${{ steps.merge.outputs.digest }}
        LEG_ID: ${{ inputs.id }}
        RUNNER_TEMP_DIR: ${{ runner.temp }}
      run: |
        set -euo pipefail
        case "$KIND" in
          apko)
            digest="$APKO_DIGEST"
            ;;
          ko)
            digest="$KO_DIGEST"
            ;;
          docker-arch)
            if [ -n "$BUILD_DIGEST" ]; then
              digest="$BUILD_DIGEST"
            else
              digest=$(jq -r --arg t "$BAKE_TARGET" '.[$t]["containerimage.digest"] // empty' <<< "$BAKE_METADATA")
            fi
            ;;
          docker-manifest)
            digest="$MERGE_DIGEST"
            ;;
          *)
            echo "::error::unknown kind: $KIND" >&2
            exit 1
            ;;
        esac
        if [[ "$digest" != sha256:* ]]; then
          echo "::error::publish did not produce a digest for $LEG_ID (got: '$digest')" >&2
          exit 1
        fi
        printf '%s\n' "$digest" > "${RUNNER_TEMP_DIR}/${LEG_ID}.txt"
        echo "digest=$digest" >> "$GITHUB_OUTPUT"
        echo "published $LEG_ID: $digest"
