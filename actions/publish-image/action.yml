name: 'Publish image'
description: >
  Publish one image to the registry and print its digest. Four kinds:
  apko publishes a multi-architecture image with apko publish inside the pinned
  Wolfi SDK image; ko publishes a multi-architecture image with ko build for
  every architecture in one invocation; docker-arch builds one architecture
  natively and pushes it by digest; docker-manifest merges the per-architecture
  digests into the tagged manifest list. The action configures the gcloud Docker
  credential helper for the registry. The calling job must authenticate to Google
  Cloud with google-github-actions/auth first.

inputs:
  kind:
    description: 'apko, ko, docker-arch, or docker-manifest.'
    required: true
  registry:
    description: 'Registry prefix without trailing slash, for example us-docker.pkg.dev/project/repo.'
    required: true
  image:
    description: 'Catalog image name.'
    required: true
  sha_tag:
    description: 'Tag for the commit SHA, including any builder prefix and variant suffix.'
    required: true
  ref_tag:
    description: 'Tag for the sanitized ref or release version, including any builder prefix and variant suffix.'
    required: true
  alias_tags:
    description: 'Extra tag names, comma-separated, without registry, each including any builder prefix and variant suffix. Published on the same image as sha_tag and ref_tag. Empty publishes none.'
    required: false
    default: ''
  id:
    description: 'Leg identifier. The digest is written to RUNNER_TEMP/<id>.txt.'
    required: true
  archs:
    description: 'apko kind only: comma-separated architectures, for example amd64,arm64.'
    required: false
    default: 'amd64,arm64'
  config:
    description: 'apko kind only: apko configuration path, relative to the repository root.'
    required: false
    default: ''
  repositories:
    description: 'apko kind only: comma-separated APK repository directories from stage-packages.'
    required: false
    default: ''
  arch:
    description: 'docker-arch kind only: architecture to build and push, amd64 or arm64.'
    required: false
    default: ''
  mode:
    description: 'docker-arch kind only: build (Dockerfile) or bake (bake file).'
    required: false
    default: 'build'
  context:
    description: 'docker-arch kind only: build context.'
    required: false
    default: '.'
  dockerfile:
    description: 'docker-arch kind only: Dockerfile path relative to the context.'
    required: false
    default: 'Dockerfile'
  target:
    description: 'docker-arch kind only: build stage or bake target.'
    required: false
    default: ''
  build_args:
    description: 'docker-arch kind only: build arguments, KEY=VALUE per line.'
    required: false
    default: ''
  bake_file:
    description: 'docker-arch kind only, bake mode: bake file path.'
    required: false
    default: 'docker-bake.hcl'
  set:
    description: 'docker-arch kind only, bake mode: bake variables, KEY=VALUE per line.'
    required: false
    default: ''
  digests_dir:
    description: 'docker-manifest kind only: directory holding the per-architecture digest files.'
    required: false
    default: ''
  importpath:
    description: 'ko kind only: Go package to build, relative to the context.'
    required: false
    default: ''
  ko_config:
    description: 'ko kind only: ko configuration file, relative to the repository root. Empty uses ko defaults.'
    required: false
    default: ''
  ldflags:
    description: 'ko kind only: one go build ldflags value per line.'
    required: false
    default: ''
  env:
    description: 'ko kind only: environment for the ko build, KEY=VALUE per line.'
    required: false
    default: ''

outputs:
  digest:
    description: 'Digest of the published image or manifest list, sha256:...'
    value: ${{ steps.digest.outputs.digest }}

runs:
  using: composite
  steps:
    - name: Configure Artifact Registry credential helper
      shell: bash
      env:
        REGISTRY: ${{ inputs.registry }}
      run: |
        set -euo pipefail
        gcloud auth configure-docker "${REGISTRY%%/*}" --quiet

    - name: Resolve apko sandbox image
      id: sandbox
      if: inputs.kind == 'apko'
      shell: bash
      run: |
        set -euo pipefail
        echo "image=$(tr -d '[:space:]' < "${GITHUB_ACTION_PATH}/../apko-sdk/image")" >> "$GITHUB_OUTPUT"

    - name: Set up Docker Buildx
      if: inputs.kind != 'apko'
      uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4

    - name: Publish with apko
      id: apko
      if: inputs.kind == 'apko'
      shell: bash
      env:
        APKO_SANDBOX: ${{ steps.sandbox.outputs.image }}
        APKO_CONFIG: ${{ inputs.config }}
        APKO_TAG: ${{ inputs.registry }}/${{ inputs.image }}:${{ inputs.sha_tag }}
        APKO_EXTRA_TAGS: ${{ inputs.registry }}/${{ inputs.image }}:${{ inputs.ref_tag }}
        APKO_REPO: ${{ inputs.registry }}/${{ inputs.image }}
        APKO_ALIAS_TAGS: ${{ inputs.alias_tags }}
        APKO_REPOSITORIES: ${{ inputs.repositories }}
        APKO_ARCHS: ${{ inputs.archs }}
        APKO_GENERIC_USER: oauth2accesstoken
        APKO_BUILD_ROOT: ${{ runner.temp }}
      run: |
        set -euo pipefail
        config_path="${GITHUB_WORKSPACE}/${APKO_CONFIG}"
        config_dir="$(cd "$(dirname "$config_path")" && pwd)"
        config_file="$(basename "$config_path")"
        out_dir="$(mktemp -d "${APKO_BUILD_ROOT}/apko-publish.XXXXXX")"

        token="$(gcloud auth print-access-token)"
        echo "::add-mask::$token"
        export APKO_GENERIC_PASS="$token"

        if [ -n "$APKO_ALIAS_TAGS" ]; then
          IFS=',' read -ra alias_tags <<< "$APKO_ALIAS_TAGS"
          for alias_tag in "${alias_tags[@]}"; do
            APKO_EXTRA_TAGS="${APKO_EXTRA_TAGS},${APKO_REPO}:${alias_tag}"
          done
        fi

        source "${GITHUB_ACTION_PATH}/apko-mounts.sh"
        apko_container_layout "$config_dir" "$out_dir"
        mounts=("${apko_mounts[@]}")
        if [ -n "$APKO_REPOSITORIES" ]; then
          IFS=',' read -ra repos <<< "$APKO_REPOSITORIES"
          for repo in "${repos[@]}"; do
            mounts+=(-v "${repo}:${repo}:ro")
          done
        fi

        read -r -d '' apko_script <<'APKO_EOF' || true
        set -euo pipefail
        if [[ -n "$APKO_GENERIC_USER" && -n "$APKO_GENERIC_PASS" ]]; then
          echo "$APKO_GENERIC_PASS" | /usr/bin/apko login -u "$APKO_GENERIC_USER" \
            --password-stdin "$(echo "$APKO_TAG" | cut -d'/' -f1)"
        fi
        export SOURCE_DATE_EPOCH=0
        tags=("$APKO_TAG")
        if [[ -n "$APKO_EXTRA_TAGS" ]]; then
          IFS=',' read -ra extra_tags <<< "$APKO_EXTRA_TAGS"
          for tag in "${extra_tags[@]}"; do
            tag="${tag#"${tag%%[![:space:]]*}"}"
            tag="${tag%"${tag##*[![:space:]]}"}"
            [[ -n "$tag" ]] && tags+=("$tag")
          done
        fi
        repos=()
        [[ -n "$APKO_REPOSITORIES" ]] && repos=(-r "$APKO_REPOSITORIES")
        /usr/bin/apko publish \
          --ignore-signatures \
          --arch "$APKO_ARCHS" \
          "${repos[@]+"${repos[@]}"}" \
          "$APKO_CONFIG_PATH" "${tags[@]}" | tee "$APKO_OUT_DIR/publish.digest"
        APKO_EOF

        docker run --rm --network host \
          --entrypoint /bin/bash \
          --workdir "$apko_workdir" \
          "${mounts[@]}" \
          -e APKO_GENERIC_USER \
          -e APKO_GENERIC_PASS \
          -e APKO_TAG \
          -e APKO_EXTRA_TAGS \
          -e APKO_REPOSITORIES \
          -e APKO_ARCHS \
          -e APKO_CONFIG_PATH="${config_dir}/${config_file}" \
          -e APKO_OUT_DIR="$out_dir" \
          "$APKO_SANDBOX" -c "$apko_script"

        ref="$(tail -n 1 "${out_dir}/publish.digest")"
        echo "digest=${ref##*@}" >> "$GITHUB_OUTPUT"

    - name: Publish with ko
      id: ko
      if: inputs.kind == 'ko'
      shell: bash
      env:
        KO_CONTEXT: ${{ inputs.context }}
        KO_IMPORTPATH: ${{ inputs.importpath }}
        KO_CONFIG: ${{ inputs.ko_config }}
        KO_LDFLAGS: ${{ inputs.ldflags }}
        KO_ENV: ${{ inputs.env }}
        KO_ARCHS: ${{ inputs.archs }}
        KO_REPO: ${{ inputs.registry }}/${{ inputs.image }}
        KO_SHA_TAG: ${{ inputs.sha_tag }}
        KO_REF_TAG: ${{ inputs.ref_tag }}
        KO_ALIAS_TAGS: ${{ inputs.alias_tags }}
        KO_BUILD_ROOT: ${{ runner.temp }}
      run: |
        set -euo pipefail
        out_dir="$(mktemp -d "${KO_BUILD_ROOT}/ko-publish.XXXXXX")"

        platforms=""
        IFS=',' read -ra archs <<< "$KO_ARCHS"
        for arch in "${archs[@]}"; do
          arch="${arch// /}"
          platforms="${platforms}linux/${arch},"
        done
        platforms="${platforms%,}"

        ko_tags="${KO_SHA_TAG},${KO_REF_TAG}"
        if [ -n "$KO_ALIAS_TAGS" ]; then
          IFS=',' read -ra alias_tags <<< "$KO_ALIAS_TAGS"
          for alias_tag in "${alias_tags[@]}"; do
            ko_tags="${ko_tags},${alias_tag}"
          done
        fi
        ko_args=(build --bare --sbom=spdx --platform="$platforms" --tags="$ko_tags")
        while IFS= read -r flag; do
          if [ -n "$flag" ]; then
            ko_args+=("--ldflags=${flag}")
          fi
        done <<< "$KO_LDFLAGS"

        if [ -n "$KO_CONFIG" ]; then
          export KO_CONFIG_PATH="${GITHUB_WORKSPACE}/${KO_CONFIG}"
        fi
        while IFS= read -r entry; do
          if [ -n "$entry" ]; then
            key="${entry%%=*}"
            export "${key}=${entry#*=}"
          fi
        done <<< "$KO_ENV"

        export KO_DOCKER_REPO="$KO_REPO"
        cd "${GITHUB_WORKSPACE}/${KO_CONTEXT}"
        ko "${ko_args[@]}" "$KO_IMPORTPATH" > "${out_dir}/publish.out"

        ref="$(tail -n 1 "${out_dir}/publish.out")"
        if [[ "$ref" != "${KO_REPO}@sha256:"* ]]; then
          echo "::error::ko did not print a published reference for ${KO_REPO}; got: '$ref'" >&2
          exit 1
        fi
        echo "digest=${ref##*@}" >> "$GITHUB_OUTPUT"

    - name: Push architecture with docker build
      id: build
      if: inputs.kind == 'docker-arch' && inputs.mode == 'build'
      uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7
      env:
        SOURCE_DATE_EPOCH: '0'
      with:
        context: "{{defaultContext}}:${{ inputs.context }}"
        file: ${{ inputs.dockerfile }}
        target: ${{ inputs.target }}
        platforms: linux/${{ inputs.arch }}
        build-args: ${{ inputs.build_args }}
        provenance: mode=max
        sbom: true
        push: true
        cache-from: type=gha,scope=${{ inputs.image }}-docker-${{ inputs.arch }}
        cache-to: type=gha,mode=max,scope=${{ inputs.image }}-docker-${{ inputs.arch }}
        outputs: type=image,push-by-digest=true,name-canonical=true,name=${{ inputs.registry }}/${{ inputs.image }},push=true

    - name: Push architecture with docker bake
      id: bake
      if: inputs.kind == 'docker-arch' && inputs.mode == 'bake'
      uses: docker/bake-action@a66e1c87e2eca0503c343edf1d208c716d54b8a8 # v7
      env:
        SOURCE_DATE_EPOCH: '0'
      with:
        source: .
        targets: ${{ inputs.target }}
        files: ${{ inputs.bake_file }}
        push: true
        set: |
          *.platform=linux/${{ inputs.arch }}
          *.tags=
          *.attest=type=provenance,mode=max
          *.attest=type=sbom
          *.cache-from=type=gha,scope=${{ inputs.image }}-docker-${{ inputs.arch }}
          *.cache-to=type=gha,mode=max,scope=${{ inputs.image }}-docker-${{ inputs.arch }}
          *.output=type=image,push-by-digest=true,name-canonical=true,name=${{ inputs.registry }}/${{ inputs.image }},push=true
          ${{ inputs.set }}

    - name: Merge digests into manifest list
      id: merge
      if: inputs.kind == 'docker-manifest'
      shell: bash
      env:
        REGISTRY: ${{ inputs.registry }}
        IMAGE: ${{ inputs.image }}
        SHA_TAG: ${{ inputs.sha_tag }}
        REF_TAG: ${{ inputs.ref_tag }}
        ALIAS_TAGS: ${{ inputs.alias_tags }}
        DIGESTS_DIR: ${{ inputs.digests_dir }}
      run: |
        set -euo pipefail
        name="${REGISTRY}/${IMAGE}"
        refs=()
        for digest_file in "$DIGESTS_DIR"/*.txt; do
          [ -f "$digest_file" ] || continue
          refs+=("${name}@$(tr -d '[:space:]' < "$digest_file")")
        done
        if [ "${#refs[@]}" -eq 0 ]; then
          echo "::error::no digest files in $DIGESTS_DIR" >&2
          exit 1
        fi
        tag_args=(-t "${name}:${SHA_TAG}" -t "${name}:${REF_TAG}")
        if [ -n "$ALIAS_TAGS" ]; then
          IFS=',' read -ra alias_tags <<< "$ALIAS_TAGS"
          for alias_tag in "${alias_tags[@]}"; do
            tag_args+=(-t "${name}:${alias_tag}")
          done
        fi
        for attempt in 1 2 3; do
          if timeout 180 docker buildx imagetools create \
            "${tag_args[@]}" \
            "${refs[@]}"; then
            break
          fi
          if [[ "$attempt" -eq 3 ]]; then
            echo "::error::imagetools create failed after ${attempt} attempts" >&2
            exit 1
          fi
          echo "::warning::imagetools create attempt ${attempt} failed, retrying in 30s"
          sleep 30
        done
        inspect_output=$(docker buildx imagetools inspect "${name}:${SHA_TAG}")
        manifest_digest=$(echo "$inspect_output" | grep 'Digest:' | head -1 | awk '{print $2}')
        platforms=$(echo "$inspect_output" | grep -E 'Platform:' | awk '{print $2}' | tr '\n' ' ')
        echo "digest=${manifest_digest}" >> "$GITHUB_OUTPUT"
        {
          echo "## Multi-arch manifest: ${IMAGE}"
          echo ""
          echo "| | |"
          echo "|---|---|"
          echo "| **Image** | \`${name}\` |"
          echo "| **Digest** | \`${manifest_digest}\` |"
          echo "| **Platforms** | ${platforms} |"
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Refresh registry auth for attestation push
      if: inputs.kind == 'apko' || inputs.kind == 'ko' || inputs.kind == 'docker-manifest'
      shell: bash
      env:
        REGISTRY: ${{ inputs.registry }}
      run: bash "${GITHUB_ACTION_PATH}/refresh-attest-auth.sh"

    - name: Resolve digest
      id: digest
      shell: bash
      env:
        KIND: ${{ inputs.kind }}
        APKO_DIGEST: ${{ steps.apko.outputs.digest }}
        KO_DIGEST: ${{ steps.ko.outputs.digest }}
        BUILD_DIGEST: ${{ steps.build.outputs.digest }}
        BAKE_METADATA: ${{ steps.bake.outputs.metadata }}
        BAKE_TARGET: ${{ inputs.target }}
        MERGE_DIGEST: ${{ steps.merge.outputs.digest }}
        LEG_ID: ${{ inputs.id }}
        RUNNER_TEMP_DIR: ${{ runner.temp }}
      run: |
        set -euo pipefail
        case "$KIND" in
          apko)
            digest="$APKO_DIGEST"
            ;;
          ko)
            digest="$KO_DIGEST"
            ;;
          docker-arch)
            if [ -n "$BUILD_DIGEST" ]; then
              digest="$BUILD_DIGEST"
            else
              digest=$(jq -r --arg t "$BAKE_TARGET" '.[$t]["containerimage.digest"] // empty' <<< "$BAKE_METADATA")
            fi
            ;;
          docker-manifest)
            digest="$MERGE_DIGEST"
            ;;
          *)
            echo "::error::unknown kind: $KIND" >&2
            exit 1
            ;;
        esac
        if [[ "$digest" != sha256:* ]]; then
          echo "::error::publish did not produce a digest for $LEG_ID (got: '$digest')" >&2
          exit 1
        fi
        printf '%s\n' "$digest" > "${RUNNER_TEMP_DIR}/${LEG_ID}.txt"
        echo "digest=$digest" >> "$GITHUB_OUTPUT"
        echo "published $LEG_ID: $digest"
