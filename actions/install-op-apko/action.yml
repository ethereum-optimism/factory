name: 'Install op-apko'
description: >
  Install the pinned op-apko release from ethereum-optimism/apko and put it on
  PATH. The release archive is verified against a pinned sha256 before it is
  extracted. Supports linux/amd64, linux/arm64 and darwin/arm64 runners. Uses
  no inputs, no token and no other actions.

outputs:
  path:
    description: Absolute path of the installed op-apko binary.
    value: ${{ steps.install.outputs.path }}

runs:
  using: composite
  steps:
    - name: Install op-apko
      id: install
      shell: bash
      env:
        VERSION: v1.5.3-op.6
        SHA256_LINUX_AMD64: 95fae5c5ec3bd45e362cc62197ba93e3f01007be82ca1132bba56e4e481bb9df
        SHA256_LINUX_ARM64: 0b2a9c4ef329dbd74c121b2eb572de756756496c3a85d7f1bdf0a80467a5be7a
        SHA256_DARWIN_ARM64: 96e7b57e3417aa534248f7eedaaae198ae2b5a33dcbdc7e7bce2ac067f4728b3
      run: |
        set -euo pipefail
        case "${RUNNER_OS}/${RUNNER_ARCH}" in
          Linux/X64)
            platform=linux_amd64
            sha256="$SHA256_LINUX_AMD64"
            ;;
          Linux/ARM64)
            platform=linux_arm64
            sha256="$SHA256_LINUX_ARM64"
            ;;
          macOS/ARM64)
            platform=darwin_arm64
            sha256="$SHA256_DARWIN_ARM64"
            ;;
          *)
            echo "::error::op-apko ${VERSION} is not available for ${RUNNER_OS}/${RUNNER_ARCH}; supported: Linux/X64, Linux/ARM64, macOS/ARM64" >&2
            exit 1
            ;;
        esac
        archive_dir="$(mktemp -d "${RUNNER_TEMP}/op-apko-archive.XXXXXX")"
        archive="${archive_dir}/op-apko_${VERSION#v}_${platform}.tar.gz"
        curl --proto '=https' --tlsv1.2 -fsSL --retry 5 --retry-all-errors -o "$archive" \
          "https://github.com/ethereum-optimism/apko/releases/download/${VERSION}/op-apko_${VERSION#v}_${platform}.tar.gz"
        if [ "${RUNNER_OS}" = macOS ]; then
          echo "${sha256}  ${archive}" | shasum -a 256 -c -
        else
          echo "${sha256}  ${archive}" | sha256sum -c -
        fi
        bin_dir="$(mktemp -d "${RUNNER_TEMP}/op-apko-bin.XXXXXX")"
        tar -xzf "$archive" -C "$bin_dir" op-apko
        chmod 0755 "${bin_dir}/op-apko"
        version_output="$("${bin_dir}/op-apko" version)"
        printf '%s\n' "$version_output"
        git_version="$(printf '%s\n' "$version_output" | awk '$1 == "GitVersion:" { print $2 }')"
        if [ "$git_version" != "$VERSION" ]; then
          echo "::error::op-apko reports GitVersion '${git_version}', expected '${VERSION}'" >&2
          exit 1
        fi
        echo "$bin_dir" >> "$GITHUB_PATH"
        echo "path=${bin_dir}/op-apko" >> "$GITHUB_OUTPUT"
