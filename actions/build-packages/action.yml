name: 'Build packages'
description: >
  Build one melange package for one architecture and upload its APK repository
  as the artifact apks-<package>-<arch>, signed with a key generated for the
  run, and the sha256 of every produced .apk as apk-digests-<package>-<arch>.
  With env_lockfile, the build environment is installed offline from the
  apk-cache artifact with the lock file's strong checksums. Optionally checks out a source
  repository, restores and saves the melange cache, and applies build
  environment entries. Uses no secrets and no OIDC token.

inputs:
  package:
    description: 'Package name from the catalog packages map.'
    required: true
  arch:
    description: 'Melange architecture: x86_64 or aarch64.'
    required: true
  config:
    description: 'Melange configuration path, relative to the repository root.'
    required: true
  cargo_profile:
    description: 'Cargo profile exported to melange pipelines. Empty when unused.'
    required: false
    default: ''
  build_version:
    description: 'Release version exported as GIT_VERSION. Empty for non-release builds.'
    required: false
    default: ''
  build_env:
    description: 'Extra KEY=VALUE lines appended to the melange environment, one per line.'
    required: false
    default: ''
  checkout_source:
    description: '"true" to check out a source repository into source_path before building.'
    required: false
    default: 'false'
  source_repository:
    description: 'Source repository (owner/name). Defaults to the calling repository.'
    required: false
    default: ''
  source_ref:
    description: 'Git ref for the source repository.'
    required: false
    default: ''
  source_path:
    description: 'Checkout path for the source repository. Must not be "." when checkout_source is true.'
    required: false
    default: '.'
  source_submodules:
    description: 'Submodule mode for the source checkout: false, true, or recursive.'
    required: false
    default: 'false'
  build_dir:
    description: >
      Directory, relative to the workspace, that the build treats as the
      repository root. The melange configuration, the pipelines directory,
      the cache key files and the melange working directory resolve under it.
      Empty or "." for the workspace.
    required: false
    default: '.'
  use_gha_cache:
    description: '"true" to restore and save the melange cache.'
    required: false
    default: 'false'
  cache_key_files:
    description: 'Comma-separated files, relative to the workspace, hashed into the cache key.'
    required: false
    default: ''
  trusted:
    description: '"true" for trusted runs. Only trusted runs may save the cache.'
    required: false
    default: 'false'
  free_disk:
    description: '"true" to remove preinstalled hosted-runner toolchains before the build.'
    required: false
    default: 'false'
  env_lockfile:
    description: 'melange environment lock file, relative to the workspace. Empty resolves the environment from the network.'
    required: false
    default: ''
  apk_cache_dir:
    description: 'With env_lockfile: apko cache directory from the apk-cache artifact.'
    required: false
    default: ''

outputs:
  digests:
    description: 'One <name>=sha256:<hex> line per produced .apk.'
    value: ${{ steps.digests.outputs.digests }}

runs:
  using: composite
  steps:
    - name: Free disk space
      if: inputs.free_disk == 'true'
      shell: bash
      run: "${GITHUB_ACTION_PATH}/free-disk.sh"

    - name: Prune unused Docker images
      if: inputs.free_disk == 'true'
      shell: bash
      run: sudo docker image prune -af >/dev/null

    - name: Checkout source repository
      if: inputs.checkout_source == 'true'
      uses: actions/checkout@71cf2267d89c5cb81562390fa70a37fa40b1305e # v6
      with:
        repository: ${{ inputs.source_repository != '' && inputs.source_repository || github.repository }}
        ref: ${{ inputs.source_ref }}
        path: ${{ inputs.source_path }}
        submodules: ${{ inputs.source_submodules }}
        persist-credentials: false

    - name: Resolve build directory
      id: build_root
      shell: bash
      env:
        BUILD_DIR: ${{ inputs.build_dir }}
      run: |
        set -euo pipefail
        root="$("${GITHUB_ACTION_PATH}/resolve-build-root.sh" "$GITHUB_WORKSPACE" "$BUILD_DIR")"
        echo "build_root=$root" >> "$GITHUB_OUTPUT"

    - name: Decide melange cache access
      id: cache_policy
      if: inputs.use_gha_cache == 'true'
      shell: bash
      env:
        TRUSTED: ${{ inputs.trusted }}
        EVENT_NAME: ${{ github.event_name }}
        REF_TYPE: ${{ github.ref_type }}
        REF_NAME: ${{ github.ref_name }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        BASE_REPOSITORY: ${{ github.repository }}
      run: |
        set -euo pipefail
        restore=false
        save=false
        reason="untrusted-ref"
        if [[ "$TRUSTED" == "true" ]]; then
          restore=true
          reason="trusted-restore-only"
          if [[ "$REF_TYPE" == "branch" && "$REF_NAME" == "$DEFAULT_BRANCH" ]]; then
            save=true
            reason="default-branch-read-write"
          fi
        elif [[ "$EVENT_NAME" == "pull_request" && "$HEAD_REPOSITORY" == "$BASE_REPOSITORY" ]]; then
          restore=true
          reason="internal-pr-restore-only"
        elif [[ "$EVENT_NAME" == "pull_request" ]]; then
          reason="fork-pr-no-cache"
        fi
        {
          echo "restore=$restore"
          echo "save=$save"
          echo "reason=$reason"
        } >> "$GITHUB_OUTPUT"
        echo "melange-cache policy: restore=$restore save=$save reason=$reason"

    - name: Compute melange cache key
      id: cache_key
      if: inputs.use_gha_cache == 'true'
      shell: bash
      env:
        PACKAGE: ${{ inputs.package }}
        ARCH: ${{ inputs.arch }}
        CARGO_PROFILE: ${{ inputs.cargo_profile }}
        KEY_FILES: ${{ inputs.cache_key_files }}
        BUILD_ROOT: ${{ steps.build_root.outputs.build_root }}
      run: |
        set -euo pipefail
        prefix="melange-v2-${PACKAGE}-${ARCH}-${CARGO_PROFILE:-none}."
        key="$prefix"
        if [ -n "$KEY_FILES" ]; then
          IFS=',' read -ra paths <<< "$KEY_FILES"
          hash_inputs=()
          for path in "${paths[@]}"; do
            path="${path#"${path%%[![:space:]]*}"}"
            path="${path%"${path##*[![:space:]]}"}"
            [ -n "$path" ] || continue
            if [ ! -f "$BUILD_ROOT/$path" ]; then
              echo "cache key file missing: $path" >&2
              exit 1
            fi
            hash_inputs+=("$path")
          done
          if [ "${#hash_inputs[@]}" -gt 0 ]; then
            key="${key}$(cd "$BUILD_ROOT" && sha256sum "${hash_inputs[@]}" | sha256sum | cut -d' ' -f1)"
          fi
        fi
        {
          echo "prefix=$prefix"
          echo "key=$key"
        } >> "$GITHUB_OUTPUT"

    - name: Restore melange cache
      id: melange_cache
      if: steps.cache_policy.outputs.restore == 'true'
      uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: melange-cache
        key: ${{ steps.cache_key.outputs.key }}
        restore-keys: |
          ${{ steps.cache_key.outputs.prefix }}

    - name: Check runner architecture matches package architecture
      shell: bash
      env:
        MELANGE_ARCH: ${{ inputs.arch }}
      run: |
        set -euo pipefail
        case "$(uname -m)" in
          x86_64) native=x86_64 ;;
          aarch64) native=aarch64 ;;
          *)
            echo "::error::unsupported runner architecture: $(uname -m)" >&2
            exit 1
            ;;
        esac
        if [ "$MELANGE_ARCH" != "$native" ]; then
          echo "::error::package arch $MELANGE_ARCH does not match runner arch $native; cross-arch builds are not configured" >&2
          exit 1
        fi

    - name: Install bubblewrap
      shell: bash
      run: |
        set -euo pipefail
        if command -v bwrap >/dev/null 2>&1; then
          exit 0
        fi
        for attempt in 1 2 3; do
          if sudo apt-get update && sudo apt-get install -y --no-install-recommends bubblewrap; then
            exit 0
          fi
          echo "bubblewrap install attempt $attempt failed" >&2
          if [ "$attempt" -lt 3 ]; then
            sleep 15
          fi
        done
        echo "::error::could not install bubblewrap after 3 attempts" >&2
        exit 1

    - name: Enable bubblewrap in ubuntu
      shell: bash
      run: |
        set -euo pipefail
        sudo tee /etc/apparmor.d/local-bwrap <<"EOF"
        abi <abi/4.0>,
        include <tunables/global>

        profile local-bwrap /usr/bin/bwrap flags=(unconfined) {
          userns,
          # Site-specific additions and overrides. See local/README for details.
          include if exists <local/bwrap>
        }
        EOF

        sudo systemctl reload apparmor
        if ! bwrap --unshare-user --bind / / true ; then
          echo "FATAL: failed to verify 'bwrap --unshare-user'" >&2
          exit 1
        fi
        echo "bubblewrap (bwrap) installed successfully."

    - name: Install op-melange
      id: melange
      uses: ./.factory/actions/install-op-melange

    - name: Prepare melange cache directory
      shell: bash
      run: mkdir -p melange-cache

    - name: Generate the package signing key
      id: signing_key
      shell: bash
      env:
        MELANGE_BIN: ${{ steps.melange.outputs.path }}
      run: |
        set -euo pipefail
        key_dir="$(mktemp -d "${RUNNER_TEMP}/melange-key.XXXXXX")"
        (cd "$key_dir" && "$MELANGE_BIN" keygen melange-run.rsa >/dev/null)
        echo "key=${key_dir}/melange-run.rsa" >> "$GITHUB_OUTPUT"

    - name: Prepare locked build environment
      id: env_lock
      if: inputs.env_lockfile != ''
      shell: bash
      env:
        ENV_LOCKFILE: ${{ inputs.env_lockfile }}
        APK_CACHE_DIR: ${{ inputs.apk_cache_dir }}
        MELANGE_ARCH: ${{ inputs.arch }}
      run: |
        set -euo pipefail
        lock="${GITHUB_WORKSPACE}/${ENV_LOCKFILE}"
        if [ ! -f "$lock" ]; then
          echo "::error::env_lockfile not found: $ENV_LOCKFILE" >&2
          exit 1
        fi
        if [ -z "$APK_CACHE_DIR" ] || [ ! -d "$APK_CACHE_DIR" ]; then
          echo "::error::env_lockfile $ENV_LOCKFILE needs the apk-cache artifact in apk_cache_dir" >&2
          exit 1
        fi
        local_entries="$(jq -r --arg a "$MELANGE_ARCH" '[.contents.packages[] | select(.local == true and .architecture == $a) | .name] | join(", ")' "$lock")"
        if [ -n "$local_entries" ]; then
          echo "::error::$ENV_LOCKFILE locks local packages ($local_entries); a build environment can only use registry packages" >&2
          exit 1
        fi
        cache="$(mktemp -d "${RUNNER_TEMP}/melange-apk-cache.XXXXXX")"
        cp -R "$APK_CACHE_DIR"/. "$cache"/
        echo "lock=$lock" >> "$GITHUB_OUTPUT"
        echo "cache=$cache" >> "$GITHUB_OUTPUT"

    - name: Compute source metadata
      id: source_metadata
      shell: bash
      env:
        SOURCE_PATH: ${{ inputs.source_path }}
      run: |
        set -euo pipefail
        source_dir="${GITHUB_WORKSPACE}/${SOURCE_PATH}"
        {
          echo "commit=$(git -C "$source_dir" rev-parse HEAD)"
          echo "date=$(git -C "$source_dir" show -s --format=%ct HEAD)"
        } >> "$GITHUB_OUTPUT"

    - name: Build melange package
      shell: bash
      env:
        MELANGE_CONFIG: ${{ inputs.config }}
        MELANGE_ARCH: ${{ inputs.arch }}
        MELANGE_CARGO_PROFILE: ${{ inputs.cargo_profile }}
        MELANGE_BUILD_VERSION: ${{ inputs.build_version }}
        MELANGE_BUILD_ENV: ${{ inputs.build_env }}
        SOURCE_PATH: ${{ inputs.source_path }}
        SOURCE_COMMIT: ${{ steps.source_metadata.outputs.commit }}
        SOURCE_DATE: ${{ steps.source_metadata.outputs.date }}
        BUILD_ROOT: ${{ steps.build_root.outputs.build_root }}
        MELANGE_BIN: ${{ steps.melange.outputs.path }}
        SIGNING_KEY: ${{ steps.signing_key.outputs.key }}
        ENV_LOCK: ${{ steps.env_lock.outputs.lock }}
        ENV_CACHE: ${{ steps.env_lock.outputs.cache }}
      run: |
        set -euo pipefail
        metadata_env="${RUNNER_TEMP}/melange-build.env"
        {
          printf 'MELANGE_CARGO_PROFILE=%s\n' "$MELANGE_CARGO_PROFILE"
          printf 'GIT_VERSION=%s\n' "$MELANGE_BUILD_VERSION"
          printf 'GIT_COMMIT=%s\n' "$SOURCE_COMMIT"
          printf 'GIT_DATE=%s\n' "$SOURCE_DATE"
          printf 'BUILD_PROFILE=%s\n' "$MELANGE_CARGO_PROFILE"
        } > "$metadata_env"
        reserved="MELANGE_CARGO_PROFILE GIT_VERSION GIT_COMMIT GIT_DATE BUILD_PROFILE"
        while IFS= read -r line; do
          line="${line#"${line%%[![:space:]]*}"}"
          line="${line%"${line##*[![:space:]]}"}"
          [ -n "$line" ] || continue
          if [[ ! "$line" =~ ^[A-Za-z_][A-Za-z0-9_]*= ]]; then
            echo "build_env line is not KEY=VALUE" >&2
            exit 1
          fi
          case " $reserved " in
            *" ${line%%=*} "*)
              echo "build_env may not set ${line%%=*}: it is derived by the build" >&2
              exit 1
              ;;
          esac
          printf '%s\n' "$line" >> "$metadata_env"
        done <<< "$MELANGE_BUILD_ENV"
        echo "melange build environment keys: $(cut -d= -f1 "$metadata_env" | tr '\n' ' ')"
        lock_args=()
        if [ -n "$ENV_LOCK" ]; then
          lock_args=(--env-lockfile "$ENV_LOCK" --offline --apk-cache-dir "$ENV_CACHE" --require-strong-checksums)
        fi
        cd "$BUILD_ROOT"
        sudo env "PATH=$PATH" \
          "$MELANGE_BIN" build "$MELANGE_CONFIG" \
          --arch "$MELANGE_ARCH" \
          --signing-key "$SIGNING_KEY" \
          "${lock_args[@]+"${lock_args[@]}"}" \
          --out-dir "${GITHUB_WORKSPACE}/apk-packages" \
          --source-dir "${GITHUB_WORKSPACE}/${SOURCE_PATH}" \
          --cache-dir "${GITHUB_WORKSPACE}/melange-cache" \
          --pipeline-dir "${BUILD_ROOT}/pipelines" \
          --env-file "$metadata_env"

    - name: Fix output permissions
      shell: bash
      run: sudo chown -R "$(id -u):$(id -g)" apk-packages melange-cache

    - name: Save melange cache
      if: steps.cache_policy.outputs.save == 'true' && steps.melange_cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: melange-cache
        key: ${{ steps.cache_key.outputs.key }}

    - name: Stage APK artifact by package
      shell: bash
      env:
        PACKAGE: ${{ inputs.package }}
      run: |
        set -euo pipefail
        mkdir -p "apk-stage/${PACKAGE}"
        cp -R apk-packages/. "apk-stage/${PACKAGE}/"

    - name: Record package digests
      id: digests
      shell: bash
      env:
        PACKAGE: ${{ inputs.package }}
        MELANGE_ARCH: ${{ inputs.arch }}
      run: |
        set -euo pipefail
        arch_dir="apk-packages/${MELANGE_ARCH}"
        mkdir -p apk-digests
        out="apk-digests/${PACKAGE}-${MELANGE_ARCH}.txt"
        : > "$out"
        tar -xzOf "${arch_dir}/APKINDEX.tar.gz" APKINDEX | awk -F: '/^P:/ {p=substr($0, 3)} /^V:/ {v=substr($0, 3)} /^$/ {if (p != "") print p "\t" v; p=""; v=""} END {if (p != "") print p "\t" v}' \
          | while IFS=$'\t' read -r name version; do
              file="${arch_dir}/${name}-${version}.apk"
              if [ ! -f "$file" ]; then
                echo "::error::APKINDEX lists ${name}-${version} but ${file} is missing" >&2
                exit 1
              fi
              printf '%s=sha256:%s\n' "$name" "$(sha256sum "$file" | cut -d' ' -f1)" >> "$out"
            done
        if [ ! -s "$out" ]; then
          echo "::error::no packages found in ${arch_dir}/APKINDEX.tar.gz" >&2
          exit 1
        fi
        cat "$out"
        {
          echo "digests<<DIGESTS_EOF"
          cat "$out"
          echo "DIGESTS_EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Upload APK artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: apks-${{ inputs.package }}-${{ inputs.arch }}
        path: apk-stage/
        if-no-files-found: error
        retention-days: 1

    - name: Upload package digests
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: apk-digests-${{ inputs.package }}-${{ inputs.arch }}
        path: apk-digests/
        if-no-files-found: error
        retention-days: 1
