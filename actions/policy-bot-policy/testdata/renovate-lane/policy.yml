policy:
  approval:
    - or:
        - 'human change'
        - 'renovate dependency update'
        - 'no accountable human author'

approval_defaults:
  options:
    allow_author: false
    allow_contributor: false
    allow_non_author_contributor: false
    invalidate_on_push: true
    ignore_edited_comments: true
    ignore_update_merges: false
    request_review:
      enabled: false
    methods:
      comments: []
      comment_patterns: []
      body_patterns: []
      github_review_comment_patterns: []
      github_review: true

approval_rules:
  - name: 'human change'
    description: 'Opened by a listed human, who is accountable for the whole change. One other listed human who has no commit on the pull request approves.'
    if:
      has_author_in:
        teams: ['ethereum-optimism/engineering']
    requires:
      count: 1
      teams: ['ethereum-optimism/engineering']

  - name: 'renovate dependency update'
    description: 'Opened by renovate from a renovate branch, commits created and signed by GitHub for that App, dependency manifests and lockfiles only. One listed human approves.'
    if:
      has_author_in:
        users: ['renovate[bot]']
      only_has_contributors_in:
        users: ['renovate[bot]']
      has_valid_signatures_by:
        users: ['web-flow']
      from_branch:
        pattern: '^renovate/'
      only_changed_files:
        paths:
          - '(^|/)go\.mod$'
          - '(^|/)go\.sum$'
          - '(^|/)uv\.lock$'
          - '(^|/)Pipfile$'
          - '(^|/)Pipfile\.lock$'
          - '(^|/)requirements\.txt$'
          - '(^|/)yarn\.lock$'
    requires:
      count: 1
      teams: ['ethereum-optimism/engineering']

  - name: 'no accountable human author'
    description: 'Default for everything else: opened by an agent, bot, machine user, outside contributor or unknown account, or automation outside its lane. Two listed humans approve.'
    requires:
      count: 2
      teams: ['ethereum-optimism/engineering']
