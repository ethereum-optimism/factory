name: 'Stage packages'
description: >
  Arrange downloaded apks-<package>-<arch> artifacts into one APK repository
  per package and print the comma-separated repository list for apko -r.

inputs:
  packages:
    description: 'Comma-separated package names an apko build needs.'
    required: true
  source:
    description: 'Directory holding one subdirectory per package, each with per-architecture subdirectories.'
    required: true
  destination:
    description: 'Directory that receives one repository per package.'
    required: true

outputs:
  repositories:
    description: 'Comma-separated repository directories, in package order.'
    value: ${{ steps.stage.outputs.repositories }}

runs:
  using: composite
  steps:
    - name: Stage APK repositories
      id: stage
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
        SOURCE_DIR: ${{ inputs.source }}
        DEST_DIR: ${{ inputs.destination }}
      run: |
        set -euo pipefail
        repos=()
        IFS=',' read -ra names <<< "$PACKAGES"
        for name in "${names[@]}"; do
          name="${name//[[:space:]]/}"
          [ -n "$name" ] || continue
          artifact="${SOURCE_DIR}/${name}"
          if [ ! -d "$artifact" ]; then
            echo "::error::no APK artifact for package $name in $SOURCE_DIR" >&2
            exit 1
          fi
          dir="${DEST_DIR}/${name}"
          mkdir -p "$dir"
          cp -R "$artifact"/. "$dir"/
          repos+=("$dir")
        done
        joined=""
        for repo in "${repos[@]+"${repos[@]}"}"; do
          joined="${joined:+$joined,}$repo"
        done
        echo "repositories=$joined" >> "$GITHUB_OUTPUT"
        echo "staged repositories: ${joined:-none}"
