name: 'Build image'
description: >
  Build one image for amd64 and load it into the local Docker daemon under
  local_ref, for smoke testing. The docker builder runs docker/build-push-action
  or docker/bake-action with load enabled. The apko builder runs apko build
  inside the Wolfi SDK container, then docker load. Uses no registry
  credentials and no OIDC token.

inputs:
  builder:
    description: 'docker or apko.'
    required: true
  image:
    description: 'Catalog image name, used for the build cache scope.'
    required: true
  local_ref:
    description: 'Local image tag to load into the Docker daemon.'
    required: true
  mode:
    description: 'docker builder only: build (Dockerfile) or bake (bake file).'
    required: false
    default: 'build'
  context:
    description: 'docker builder only: build context, relative to the repository root.'
    required: false
    default: '.'
  dockerfile:
    description: 'docker builder only: Dockerfile path, relative to the build context.'
    required: false
    default: 'Dockerfile'
  target:
    description: 'docker builder only: build stage or bake target.'
    required: false
    default: ''
  build_args:
    description: 'docker builder only: build arguments, KEY=VALUE per line.'
    required: false
    default: ''
  bake_file:
    description: 'docker builder only, bake mode: bake file path.'
    required: false
    default: 'docker-bake.hcl'
  set:
    description: 'docker builder only, bake mode: bake variables, KEY=VALUE per line.'
    required: false
    default: ''
  config:
    description: 'apko builder only: apko configuration path, relative to the repository root.'
    required: false
    default: ''
  repositories:
    description: 'apko builder only: comma-separated APK repository directories from stage-packages.'
    required: false
    default: ''

outputs:
  image:
    description: 'The local image reference that was loaded.'
    value: ${{ inputs.local_ref }}

runs:
  using: composite
  steps:
    - name: Set up Docker Buildx
      if: inputs.builder == 'docker'
      uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4

    - name: Build image (docker build mode)
      if: inputs.builder == 'docker' && inputs.mode == 'build'
      uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7
      with:
        context: "{{defaultContext}}:${{ inputs.context }}"
        file: ${{ inputs.dockerfile }}
        target: ${{ inputs.target }}
        platforms: linux/amd64
        build-args: ${{ inputs.build_args }}
        push: false
        load: true
        tags: ${{ inputs.local_ref }}
        cache-from: type=gha,scope=${{ inputs.image }}-docker-amd64

    - name: Build image (docker bake mode)
      if: inputs.builder == 'docker' && inputs.mode == 'bake'
      uses: docker/bake-action@a66e1c87e2eca0503c343edf1d208c716d54b8a8 # v7
      with:
        source: .
        targets: ${{ inputs.target }}
        files: ${{ inputs.bake_file }}
        push: false
        load: true
        set: |
          ${{ inputs.target }}.tags=${{ inputs.local_ref }}
          *.platform=linux/amd64
          *.cache-from=type=gha,scope=${{ inputs.image }}-docker-amd64
          ${{ inputs.set }}

    - name: Build image (apko)
      if: inputs.builder == 'apko'
      shell: bash
      env:
        APKO_CONFIG: ${{ inputs.config }}
        APKO_TAG: ${{ inputs.local_ref }}
        APKO_REPOSITORIES: ${{ inputs.repositories }}
        APKO_OUT: ${{ runner.temp }}/apko-build.tar
      run: |
        set -euo pipefail
        docker run -i --rm --entrypoint /bin/bash \
          --network host \
          -v "$PWD:${GITHUB_WORKSPACE}" \
          -v "${RUNNER_TEMP}:${RUNNER_TEMP}" \
          --workdir "${GITHUB_WORKSPACE}" \
          -e APKO_CONFIG \
          -e APKO_TAG \
          -e APKO_REPOSITORIES \
          -e APKO_OUT \
          ghcr.io/wolfi-dev/sdk:latest <<'APKO_EOF'
        set -euo pipefail
        repos=()
        [[ -n "$APKO_REPOSITORIES" ]] && repos=(-r "$APKO_REPOSITORIES")
        /usr/bin/apko build \
          --ignore-signatures \
          --arch amd64 \
          "${repos[@]+"${repos[@]}"}" \
          "$APKO_CONFIG" "$APKO_TAG" "$APKO_OUT"
        APKO_EOF
        loaded="$(docker load -i "$APKO_OUT" | sed -n 's/^Loaded image: //p' | tail -n 1)"
        if [ -z "$loaded" ]; then
          echo "::error::docker load did not report a loaded image for $APKO_TAG" >&2
          exit 1
        fi
        docker tag "$loaded" "$APKO_TAG"
        rm -f "$APKO_OUT"
