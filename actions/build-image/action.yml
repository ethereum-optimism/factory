name: 'Build image'
description: >
  Build one image for amd64 and load it into the local Docker daemon under
  local_ref, for smoke testing. The docker builder runs docker/build-push-action
  or docker/bake-action with load enabled, or ko writes an image tarball that is
  then loaded. The apko builder runs apko build
  inside the pinned Wolfi SDK image, then docker load. Uses no registry
  credentials and no OIDC token.

inputs:
  builder:
    description: 'docker or apko.'
    required: true
  image:
    description: 'Catalog image name, used for the build cache scope.'
    required: true
  local_ref:
    description: 'Local image tag to load into the Docker daemon.'
    required: true
  mode:
    description: 'docker builder only: build (Dockerfile), bake (bake file), or ko (Go package).'
    required: false
    default: 'build'
  context:
    description: 'docker builder only: build context, relative to the repository root.'
    required: false
    default: '.'
  dockerfile:
    description: 'docker builder only: Dockerfile path, relative to the build context.'
    required: false
    default: 'Dockerfile'
  target:
    description: 'docker builder only: build stage or bake target.'
    required: false
    default: ''
  build_args:
    description: 'docker builder only: build arguments, KEY=VALUE per line.'
    required: false
    default: ''
  bake_file:
    description: 'docker builder only, bake mode: bake file path.'
    required: false
    default: 'docker-bake.hcl'
  set:
    description: 'docker builder only, bake mode: bake variables, KEY=VALUE per line.'
    required: false
    default: ''
  config:
    description: 'apko builder only: apko configuration path, relative to the repository root.'
    required: false
    default: ''
  repositories:
    description: 'apko builder only: comma-separated APK repository directories from stage-packages.'
    required: false
    default: ''
  importpath:
    description: 'docker builder only, ko mode: Go package to build, relative to the context.'
    required: false
    default: ''
  ko_config:
    description: 'docker builder only, ko mode: ko configuration file, relative to the repository root. Empty uses ko defaults.'
    required: false
    default: ''
  ldflags:
    description: 'docker builder only, ko mode: one go build ldflags value per line.'
    required: false
    default: ''
  env:
    description: 'docker builder only, ko mode: environment for the ko build, KEY=VALUE per line.'
    required: false
    default: ''

outputs:
  image:
    description: 'The local image reference that was loaded.'
    value: ${{ inputs.local_ref }}

runs:
  using: composite
  steps:
    - name: Resolve apko sandbox image
      id: sandbox
      if: inputs.builder == 'apko'
      shell: bash
      run: |
        set -euo pipefail
        echo "image=$(tr -d '[:space:]' < "${GITHUB_ACTION_PATH}/../apko-sdk/image")" >> "$GITHUB_OUTPUT"

    - name: Set up Docker Buildx
      if: inputs.builder == 'docker'
      uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4

    - name: Build image (docker build mode)
      if: inputs.builder == 'docker' && inputs.mode == 'build'
      uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7
      env:
        SOURCE_DATE_EPOCH: '0'
      with:
        context: "{{defaultContext}}:${{ inputs.context }}"
        file: ${{ inputs.dockerfile }}
        target: ${{ inputs.target }}
        platforms: linux/amd64
        build-args: ${{ inputs.build_args }}
        push: false
        load: true
        tags: ${{ inputs.local_ref }}
        cache-from: type=gha,scope=${{ inputs.image }}-docker-amd64

    - name: Build image (docker bake mode)
      if: inputs.builder == 'docker' && inputs.mode == 'bake'
      uses: docker/bake-action@a66e1c87e2eca0503c343edf1d208c716d54b8a8 # v7
      env:
        SOURCE_DATE_EPOCH: '0'
      with:
        source: .
        targets: ${{ inputs.target }}
        files: ${{ inputs.bake_file }}
        push: false
        load: true
        set: |
          ${{ inputs.target }}.tags=${{ inputs.local_ref }}
          *.platform=linux/amd64
          *.cache-from=type=gha,scope=${{ inputs.image }}-docker-amd64
          ${{ inputs.set }}

    - name: Build image (ko)
      if: inputs.builder == 'docker' && inputs.mode == 'ko'
      shell: bash
      env:
        KO_CONTEXT: ${{ inputs.context }}
        KO_IMPORTPATH: ${{ inputs.importpath }}
        KO_CONFIG: ${{ inputs.ko_config }}
        KO_LDFLAGS: ${{ inputs.ldflags }}
        KO_ENV: ${{ inputs.env }}
        KO_IMAGE: ${{ inputs.image }}
        KO_LOCAL_REF: ${{ inputs.local_ref }}
        KO_BUILD_ROOT: ${{ runner.temp }}
      run: |
        set -euo pipefail
        out_dir="$(mktemp -d "${KO_BUILD_ROOT}/ko-build.XXXXXX")"
        tarball="${out_dir}/image.tar"

        ko_args=(build --push=false --tarball "$tarball" --platform=linux/amd64 --bare --sbom=none)
        while IFS= read -r flag; do
          if [ -n "$flag" ]; then
            ko_args+=("--ldflags=${flag}")
          fi
        done <<< "$KO_LDFLAGS"

        if [ -n "$KO_CONFIG" ]; then
          export KO_CONFIG_PATH="${GITHUB_WORKSPACE}/${KO_CONFIG}"
        fi
        while IFS= read -r entry; do
          if [ -n "$entry" ]; then
            key="${entry%%=*}"
            export "${key}=${entry#*=}"
          fi
        done <<< "$KO_ENV"

        export KO_DOCKER_REPO="local/${KO_IMAGE}"
        cd "${GITHUB_WORKSPACE}/${KO_CONTEXT}"
        ko "${ko_args[@]}" "$KO_IMPORTPATH"

        loaded="$(docker load -i "$tarball" | sed -n 's/^Loaded image: //p' | tail -n 1)"
        if [ -z "$loaded" ]; then
          echo "::error::docker load did not report a loaded image for $KO_LOCAL_REF" >&2
          exit 1
        fi
        docker tag "$loaded" "$KO_LOCAL_REF"

    - name: Build image (apko)
      if: inputs.builder == 'apko'
      shell: bash
      env:
        APKO_SANDBOX: ${{ steps.sandbox.outputs.image }}
        APKO_CONFIG: ${{ inputs.config }}
        APKO_TAG: ${{ inputs.local_ref }}
        APKO_REPOSITORIES: ${{ inputs.repositories }}
        APKO_BUILD_ROOT: ${{ runner.temp }}
      run: |
        set -euo pipefail
        config_path="${GITHUB_WORKSPACE}/${APKO_CONFIG}"
        config_dir="$(cd "$(dirname "$config_path")" && pwd)"
        config_file="$(basename "$config_path")"
        out_dir="$(mktemp -d "${APKO_BUILD_ROOT}/apko-build.XXXXXX")"

        mounts=(-v "${config_dir}:${config_dir}:ro" -v "${out_dir}:${out_dir}")
        repo_args=()
        if [ -n "$APKO_REPOSITORIES" ]; then
          IFS=',' read -ra repos <<< "$APKO_REPOSITORIES"
          for repo in "${repos[@]}"; do
            mounts+=(-v "${repo}:${repo}:ro")
          done
          repo_args=(-r "$APKO_REPOSITORIES")
        fi

        docker run --rm --network host \
          --entrypoint /usr/bin/apko \
          --workdir "$out_dir" \
          "${mounts[@]}" \
          "$APKO_SANDBOX" \
          build \
          --ignore-signatures \
          --arch amd64 \
          "${repo_args[@]+"${repo_args[@]}"}" \
          "${config_dir}/${config_file}" "$APKO_TAG" "${out_dir}/image.tar"

        loaded="$(docker load -i "${out_dir}/image.tar" | sed -n 's/^Loaded image: //p' | tail -n 1)"
        if [ -z "$loaded" ]; then
          echo "::error::docker load did not report a loaded image for $APKO_TAG" >&2
          exit 1
        fi
        docker tag "$loaded" "$APKO_TAG"
