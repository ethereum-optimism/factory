name: 'Smoke test'
description: >
  Run smoke commands, smoke tests, and an optional script against one image.
  Verifies the image architecture, runs each command with its entrypoint, runs
  each test and checks its exit code and output, and fails when
  expected_version is set and no command or test reports it.

inputs:
  image:
    description: 'Image reference to test: a local tag, or a registry reference with a digest.'
    required: true
  arch:
    description: 'Docker architecture of the image: amd64 or arm64.'
    required: true
  pull:
    description: '"true" to pull the image for the platform first, "false" for a locally loaded image.'
    required: false
    default: 'false'
  commands:
    description: 'JSON array of smoke commands. Each string is split on whitespace into entrypoint and arguments.'
    required: false
    default: '[]'
  tests:
    description: 'JSON array of smoke tests, each {args, entrypoint, shell, expected_exit, expected_output} as normalized by plan-images.'
    required: false
    default: '[]'
  script:
    description: 'Optional repository script run with IMAGE and IMAGE_ARCH set. Must exit 0.'
    required: false
    default: ''
  expected_version:
    description: 'Release version (for example v1.2.3) that at least one command must print. Empty disables the check.'
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Run smoke tests
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        IMAGE_ARCH: ${{ inputs.arch }}
        PULL: ${{ inputs.pull }}
        COMMANDS: ${{ inputs.commands }}
        TESTS: ${{ inputs.tests }}
        SCRIPT: ${{ inputs.script }}
        EXPECTED_VERSION: ${{ inputs.expected_version }}
      run: |
        set -euo pipefail
        if [ "$PULL" = "true" ]; then
          docker pull --platform "linux/$IMAGE_ARCH" "$IMAGE"
        fi

        pulled_arch="$(docker image inspect --format '{{.Architecture}}' "$IMAGE")"
        if [ -z "$pulled_arch" ]; then
          echo "::notice::docker reports no architecture for $IMAGE; the platform is enforced by docker run --platform"
        elif [ "$pulled_arch" != "$IMAGE_ARCH" ]; then
          echo "FAIL: $IMAGE is $pulled_arch but the test architecture is $IMAGE_ARCH" >&2
          exit 1
        fi

        version_matched=false
        normalized_version="${EXPECTED_VERSION#v}"
        while IFS= read -r cmd; do
          cmd="${cmd#"${cmd%%[![:space:]]*}"}"
          cmd="${cmd%"${cmd##*[![:space:]]}"}"
          [ -n "$cmd" ] || continue
          read -ra parts <<< "$cmd"
          entrypoint="${parts[0]}"
          args=("${parts[@]:1}")
          echo "==> docker run --platform linux/$IMAGE_ARCH --entrypoint $entrypoint ... ${args[*]:-}"
          set +e
          output=$(docker run --rm --platform "linux/$IMAGE_ARCH" --entrypoint "$entrypoint" "$IMAGE" "${args[@]+"${args[@]}"}" 2>&1)
          rc=$?
          set -e
          printf '%s\n' "$output"
          if [[ -n "$normalized_version" && "$output" == *"$normalized_version"* ]]; then
            version_matched=true
          fi
          if [ "$rc" -eq 125 ] || [ "$rc" -eq 126 ] || [ "$rc" -eq 127 ] \
            || { [ "$rc" -ge 129 ] && [ "$rc" -le 159 ]; }; then
            echo "FAIL: $entrypoint could not run (exit $rc)"
            exit 1
          fi
        done < <(jq -r '.[]' <<< "$COMMANDS")

        test_count="$(jq 'length' <<< "${TESTS:-[]}")"
        for ((i = 0; i < test_count; i++)); do
          test_json="$(jq -c --argjson i "$i" '.[$i]' <<< "$TESTS")"
          entrypoint="$(jq -r '.entrypoint // ""' <<< "$test_json")"
          shell_cmd="$(jq -r '.shell // ""' <<< "$test_json")"
          expected_exit="$(jq -r '.expected_exit // 0' <<< "$test_json")"
          expected_output="$(jq -r '.expected_output // ""' <<< "$test_json")"
          args=()
          while IFS= read -r -d '' arg; do
            args+=("$arg")
          done < <(jq -j '(.args // [])[] | ., "\u0000"' <<< "$test_json")
          run=(docker run --rm --platform "linux/$IMAGE_ARCH")
          if [ -n "$entrypoint" ]; then
            run+=(--entrypoint "$entrypoint")
          fi
          run+=("$IMAGE")
          if [ -n "$shell_cmd" ]; then
            run+=(-c "$shell_cmd")
          else
            run+=("${args[@]+"${args[@]}"}")
          fi
          echo "==> smoke test $((i + 1)): ${run[*]:5}"
          set +e
          output="$("${run[@]}" 2>&1)"
          rc=$?
          set -e
          printf '%s\n' "$output"
          if [[ -n "$normalized_version" && "$output" == *"$normalized_version"* ]]; then
            version_matched=true
          fi
          if [ "$rc" -ne "$expected_exit" ]; then
            echo "FAIL: smoke test $((i + 1)) exited with $rc, expected $expected_exit" >&2
            exit 1
          fi
          if [[ -n "$expected_output" && "$output" != *"$expected_output"* ]]; then
            echo "FAIL: smoke test $((i + 1)) output does not contain: $expected_output" >&2
            exit 1
          fi
        done

        if [[ -n "$normalized_version" && "$version_matched" != "true" ]]; then
          echo "FAIL: no smoke command or test reported expected version $EXPECTED_VERSION" >&2
          exit 1
        fi

        if [ -n "$SCRIPT" ]; then
          IMAGE="$IMAGE" IMAGE_ARCH="$IMAGE_ARCH" bash "$SCRIPT"
        fi
